name: motion-platform

services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    user: "1883:1883"
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - type: bind
        source: ./mosquitto/config
        target: /mosquitto/config
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: mqtt_auth
        target: /mosquitto/auth
        read_only: true
      - type: volume
        source: mqtt_data
        target: /mosquitto/data
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  mqtt-init:
    image: eclipse-mosquitto:2.1.2-alpine
    user: "0:0"
    profiles: ["tools"]
    entrypoint: ["sh"]
    command: ["/init/initialize.sh", "reuse"]
    volumes:
      - type: bind
        source: ./mosquitto/init-credentials.sh
        target: /init/initialize.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./mosquitto/acl
        target: /input/acl
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: mqtt_auth
        target: /auth
    network_mode: none

  postgres:
    image: postgres:17-bookworm
    profiles: ["storage"]
    env_file:
      - path: ./postgres/.env
        required: false
    environment:
      POSTGRES_DB: motion
      POSTGRES_USER: motion
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/sql:/sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "motion", "-d", "motion"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: postgres:17-bookworm
    profiles: ["app"]
    env_file:
      - path: ./postgres/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./postgres/sql:/sql:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'PGPASSWORD="${POSTGRES_PASSWORD:?PostgreSQL password required}" exec psql -X -h postgres -U motion -d motion -f /sql/001_initial.sql'

  ingestion:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.dotnet
      args:
        PROJECT: Motion.Ingestion
    env_file:
      - path: ./postgres/.env
        required: false
    environment:
      MOTION_DB_HOST: postgres
      MOTION_DB_PORT: "5432"
      MOTION_MQTT_HOST: mosquitto
    volumes:
      - type: bind
        source: ../secrets/mqtt/clients.json
        target: /app/secrets/mqtt/clients.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
    restart: "on-failure:5"

  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.dotnet
      args:
        PROJECT: Motion.Api
    env_file:
      - path: ./postgres/.env
        required: false
    environment:
      MOTION_DB_HOST: postgres
      MOTION_DB_PORT: "5432"
      MOTION_API_URL: http://0.0.0.0:5086
    ports:
      - "127.0.0.1:5086:5086"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  mqtt_auth:
  mqtt_data:
