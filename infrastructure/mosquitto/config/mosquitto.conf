# Mosquitto 2.1 authentication/authorization plugins, applied globally.
global_plugin /usr/lib/mosquitto_password_file.so
plugin_opt_password_file /mosquitto/auth/password_file

global_plugin /usr/lib/mosquitto_acl_file.so
plugin_opt_acl_file /mosquitto/auth/acl

listener 1883 0.0.0.0
listener_allow_anonymous false

# Broker snapshots are not the application's historical database.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
